<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111317" />
    <meta name="description" content="FLOWLINE — a minimalist, chill endless driving game." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOWLINE" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>FLOWLINE</title>
    <style>
      :root {
        --bg: #111317;
        --fg: #f4f1ea;
        --accent: #e86a4a;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --bg: #ece8e0;
        --fg: #1c1f24;
        --accent: #e05a3a;
        color-scheme: light;
      }
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        transition: background-color 400ms var(--ease), color 400ms var(--ease);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ── HUD ── */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px)
          calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);
      }
      .readout {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 18px);
        left: calc(env(safe-area-inset-left) + 20px);
        opacity: 0;
        transition: opacity 400ms var(--ease);
      }
      #hud.playing .readout {
        opacity: 1;
      }
      #score {
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        opacity: 0.85;
        line-height: 1;
      }
      #streak {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 8px 3px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity 300ms var(--ease), transform 300ms var(--ease);
      }
      #streak.show {
        opacity: 1;
        transform: none;
      }
      #streak.bump {
        animation: bump 260ms var(--ease);
      }
      @keyframes bump {
        0% {
          transform: scale(1.18);
        }
        100% {
          transform: none;
        }
      }
      #flow {
        width: 92px;
        height: 3px;
        margin-top: 10px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--fg) 14%, transparent);
        overflow: hidden;
      }
      #flow-fill {
        height: 100%;
        background: var(--fg);
        opacity: 0.7;
        transform-origin: left center;
        transition: background-color 300ms var(--ease);
      }
      #flow.low #flow-fill {
        background: var(--accent);
        opacity: 1;
        animation: lowpulse 0.8s ease-in-out infinite;
      }
      @keyframes lowpulse {
        50% {
          opacity: 0.35;
        }
      }
      .center-note {
        position: fixed;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms var(--ease), transform 300ms var(--ease);
      }
      #drift {
        bottom: calc(env(safe-area-inset-bottom) + 40px);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2em;
        font-variant-numeric: tabular-nums;
        transform: translateY(6px);
      }
      #drift.show {
        opacity: 0.85;
        transform: none;
      }
      #banner {
        top: 26%;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        color: var(--accent);
        transform: scale(0.96);
      }
      #banner.show {
        opacity: 1;
        transform: none;
      }
      #hint {
        bottom: calc(env(safe-area-inset-bottom) + 84px);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #hint.show {
        opacity: 0.7;
      }
      #results {
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 450ms var(--ease), transform 450ms var(--ease);
        text-align: center;
        padding-bottom: 12vh;
        text-shadow: 0 0 14px var(--bg), 0 0 4px var(--bg);
      }
      #results.show {
        opacity: 1;
        transform: none;
      }
      #results::before {
        content: '';
        position: absolute;
        inset: -10%;
        z-index: -1;
        background: radial-gradient(ellipse 60% 48% at 50% 44%, color-mix(in srgb, var(--bg) 78%, transparent), transparent 75%);
      }
      .r-label {
        font-size: 11px;
        letter-spacing: 0.4em;
        margin-right: -0.4em;
        opacity: 0.6;
      }
      .r-best {
        color: var(--accent);
        opacity: 1;
      }
      .r-score {
        font-size: clamp(44px, 15vw, 64px);
        font-weight: 300;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 24px var(--bg);
      }
      .r-stats {
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 22px;
        margin-top: 4px;
      }
      .r-stats div {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .r-stats b {
        font-size: 16px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .r-stats span {
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.5;
      }
      .r-sub {
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.45;
        min-height: 1em;
      }
      .r-prompt {
        margin-top: 22px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        animation: pulse 2.4s var(--ease) infinite;
      }
      .controls {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 12px);
        right: calc(env(safe-area-inset-right) + 12px);
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      .controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg);
        opacity: 0.65;
        cursor: pointer;
        display: grid;
        place-items: center;
        border-radius: 10px;
        transition: opacity 200ms var(--ease), color 400ms var(--ease);
        touch-action: manipulation;
      }
      .controls button:hover,
      .controls button:active,
      .controls button:focus-visible {
        opacity: 1;
        outline: none;
      }
      .controls svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #btn-theme[data-state='dark'] .i-sun,
      #btn-theme[data-state='light'] .i-moon,
      #btn-audio[data-state='on'] .i-off,
      #btn-audio[data-state='off'] .i-on {
        display: none;
      }

      /* ── Title ── */
      #title {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: none;
        text-align: center;
        transition: opacity 400ms var(--ease);
        padding-bottom: 36vh;
      }
      #title.hidden {
        opacity: 0;
      }
      #title h1 {
        margin: 0;
        font-size: clamp(26px, 8vw, 40px);
        font-weight: 300;
        letter-spacing: 0.62em;
        margin-right: -0.62em; /* optically re-centre tracked text */
        text-shadow: 0 1px 18px var(--bg);
      }
      #best {
        font-size: 11px;
        letter-spacing: 0.28em;
        font-variant-numeric: tabular-nums;
        opacity: 0.55;
      }
      #prompt {
        margin-top: 18px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        animation: pulse 2.4s var(--ease) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #prompt {
          animation: none;
          opacity: 0.6;
        }
      }

      /* ── Arcade HUD ── */
      #mult {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
        opacity: 0;
        transition: opacity 300ms var(--ease);
      }
      #powers {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
        max-width: 50vw;
      }
      #powers span {
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        background: var(--accent);
        color: #fff;
      }
      #mult.show {
        opacity: 1;
      }
      #mult.bump {
        animation: bump 260ms var(--ease);
      }
      #timer {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 10px);
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        transition: opacity 400ms var(--ease);
      }
      #hud.playing #timer,
      #hud.playing #speed,
      #hud.playing #nitro {
        opacity: 1;
      }
      #time {
        font-size: 38px;
        font-weight: 300;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 16px var(--bg);
      }
      #timer.low #time {
        color: var(--accent);
        animation: lowpulse 0.5s ease-in-out infinite;
      }
      .cp {
        width: 74px;
        height: 2px;
        margin: 7px auto 0;
        border-radius: 1px;
        background: color-mix(in srgb, var(--fg) 14%, transparent);
        overflow: hidden;
      }
      #cp-fill {
        height: 100%;
        background: var(--accent);
        transform-origin: left center;
        transform: scaleX(0);
      }
      .cp-label {
        margin-top: 5px;
        font-size: 8px;
        letter-spacing: 0.26em;
        opacity: 0.45;
      }
      #speed {
        position: absolute;
        left: calc(env(safe-area-inset-left) + 20px);
        bottom: calc(env(safe-area-inset-bottom) + 26px);
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity 400ms var(--ease);
      }
      #speed small {
        margin-left: 4px;
        font-size: 9px;
        letter-spacing: 0.18em;
        opacity: 0.5;
      }
      #nitro {
        position: absolute;
        right: calc(env(safe-area-inset-right) + 18px);
        bottom: calc(env(safe-area-inset-bottom) + 18px);
        width: 68px;
        height: 68px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        color: var(--fg);
        pointer-events: auto;
        opacity: 0;
        display: grid;
        place-items: center;
        transition: opacity 400ms var(--ease), transform 150ms var(--ease);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #nitro svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
        fill: none;
        stroke-width: 3;
      }
      #nitro .track {
        stroke: color-mix(in srgb, var(--fg) 14%, transparent);
      }
      #nitro-ring {
        stroke: var(--fg);
        stroke-linecap: round;
        stroke-dasharray: 163.4;
        stroke-dashoffset: 163.4;
        opacity: 0.5;
      }
      #nitro span {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        opacity: 0.45;
      }
      #nitro sub {
        font-size: 8px;
      }
      #nitro.ready #nitro-ring,
      #nitro.burning #nitro-ring {
        stroke: var(--accent);
        opacity: 1;
      }
      #nitro.ready span {
        color: var(--accent);
        opacity: 1;
      }
      #nitro.ready {
        animation: ready 1.2s ease-in-out infinite;
      }
      #nitro:active {
        transform: scale(0.92);
      }
      @keyframes ready {
        50% {
          box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent);
        }
      }
      #drift {
        bottom: calc(env(safe-area-inset-bottom) + 110px);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.18em;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        text-shadow: 0 0 12px var(--bg);
      }
      #banner small {
        display: block;
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 0.24em;
        color: var(--fg);
        opacity: 0.7;
      }

      /* ── Meta: level, coins, missions ── */
      .meta {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 22px);
        left: calc(env(safe-area-inset-left) + 20px);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
      }
      #meta-coins {
        color: var(--accent);
      }
      .xp-bar {
        display: inline-block;
        width: 56px;
        height: 3px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--fg) 15%, transparent);
        overflow: hidden;
      }
      .xp-bar > * {
        display: block;
        height: 100%;
        background: var(--fg);
        transform-origin: left center;
      }
      .missions {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-align: left;
        min-width: min(300px, 80vw);
        text-shadow: 0 0 10px var(--bg);
      }
      .missions li,
      .r-missions li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .m-check {
        width: 13px;
        height: 13px;
        flex: none;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 40%, transparent);
        font-size: 10px;
        line-height: 13px;
        text-align: center;
        color: var(--bg);
      }
      li.done .m-check {
        background: var(--accent);
        box-shadow: none;
      }
      li.done .m-text {
        opacity: 0.5;
        text-decoration: line-through;
      }
      .m-text {
        flex: 1;
        opacity: 0.85;
      }
      .missions em,
      .r-missions em {
        font-style: normal;
        opacity: 0.5;
        font-variant-numeric: tabular-nums;
      }
      .m-reward {
        color: var(--accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .garage-btn {
        pointer-events: auto;
        margin-top: 26px;
        padding: 11px 26px;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--fg);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 35%, transparent);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3em;
        cursor: pointer;
        position: relative;
      }
      .garage-btn .dot {
        position: absolute;
        top: 6px;
        right: 10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      #title.hidden .garage-btn,
      #results:not(.show) * {
        pointer-events: none !important;
      }
      #hud:not(.playing) #nitro {
        pointer-events: none;
      }
      #title .garage-btn {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom) + 34px);
      }

      /* ── Results extras ── */
      .r-xp {
        width: min(300px, 80vw);
        margin-top: 8px;
      }
      .r-xp-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 0.2em;
        margin-bottom: 6px;
        opacity: 0.85;
      }
      .r-up {
        color: var(--accent);
      }
      .r-xp .xp-bar {
        width: 100%;
      }
      .r-coins {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--accent);
      }
      .r-missions {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 11px;
        text-align: left;
        width: min(300px, 80vw);
      }
      .r-actions .garage-btn {
        margin-top: 8px;
      }
      #results .r-prompt {
        margin-top: 8px;
      }

      /* ── Garage ── */
      #garage {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);
        overflow-y: auto;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 300ms var(--ease);
      }
      #garage.show {
        opacity: 1;
        pointer-events: auto;
      }
      .g-top {
        width: 100%;
        max-width: 420px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
      }
      #g-coins {
        color: var(--accent);
      }
      #g-close {
        margin-left: auto;
        width: 36px;
        height: 36px;
        border: 0;
        background: none;
        color: var(--fg);
        font-size: 16px;
        opacity: 0.7;
        cursor: pointer;
      }
      .g-title {
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        opacity: 0.55;
      }
      .g-stage {
        flex: 1;
        width: 100%;
        max-width: 420px;
        min-height: 180px;
        display: flex;
        align-items: center;
      }
      #garage-canvas {
        position: static;
        flex: 1;
        width: auto;
        height: 100%;
        max-height: 340px;
        min-width: 0;
        touch-action: none;
      }
      #g-prev,
      #g-next {
        width: 44px;
        height: 64px;
        border: 0;
        background: none;
        color: var(--fg);
        font-size: 36px;
        font-weight: 200;
        opacity: 0.6;
        cursor: pointer;
      }
      #g-count {
        font-size: 9px;
        letter-spacing: 0.3em;
        opacity: 0.45;
      }
      #g-name {
        margin-top: 6px;
        font-size: 26px;
        font-weight: 300;
        letter-spacing: 0.3em;
        margin-right: -0.3em;
        text-transform: uppercase;
      }
      #g-tag {
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.12em;
        opacity: 0.55;
      }
      #g-stats {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: min(260px, 76vw);
      }
      #g-stats div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 9px;
        letter-spacing: 0.24em;
      }
      #g-stats span {
        opacity: 0.6;
      }
      #g-stats b {
        display: flex;
        gap: 4px;
      }
      #g-stats i {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--fg) 14%, transparent);
      }
      #g-stats i.on {
        background: var(--accent);
      }
      #g-action {
        margin-top: 22px;
        min-width: 220px;
        padding: 14px 26px;
        border: 0;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        cursor: pointer;
      }
      #g-action.buy {
        background: var(--accent);
        color: #fff;
      }
      #g-action:disabled {
        background: none;
        color: var(--fg);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 30%, transparent);
        opacity: 0.6;
        cursor: default;
      }

      /* ── Tuning ── */
      #g-stats div {
        gap: 10px;
      }
      #g-stats span {
        width: 74px;
        flex: none;
      }
      #g-stats em {
        display: flex;
        gap: 3px;
        font-style: normal;
      }
      #g-stats u {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 35%, transparent);
      }
      #g-stats u.on {
        background: var(--fg);
        box-shadow: none;
      }
      .g-up {
        margin-left: auto;
        min-width: 76px;
        padding: 6px 8px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .g-up.poor {
        background: none;
        color: var(--fg);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 30%, transparent);
        opacity: 0.55;
      }
      .g-up.max {
        background: none;
        color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      #g-stats {
        width: min(340px, 90vw);
      }
      #g-paints {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: min(340px, 90vw);
      }
      .sw {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--c);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        position: relative;
      }
      .sw.factory {
        background: conic-gradient(from 45deg, var(--fg) 0 50%, var(--bg) 50% 100%);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 40%, transparent);
      }
      .sw.lockedp {
        opacity: 0.45;
      }
      .sw.lockedp::after {
        content: '';
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: inset 0 0 0 2px var(--fg);
      }
      .sw.sel {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        opacity: 1;
      }
      #g-paint-name {
        margin-top: 8px;
        min-height: 1em;
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      #g-action {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="FLOWLINE game"></canvas>

    <div id="title">
      <div class="meta">
        <span id="meta-level">LV 1</span>
        <span class="xp-bar"><span id="meta-xp-fill"></span></span>
        <span id="meta-coins">◈ 0</span>
      </div>
      <h1>FLOWLINE</h1>
      <div id="best" hidden></div>
      <ul id="missions" class="missions" aria-label="Missions"></ul>
      <div id="prompt">Tap anywhere to drive</div>
      <button type="button" class="garage-btn garage-open">GARAGE</button>
    </div>

    <div id="drift" class="center-note"></div>
    <div id="banner" class="center-note"></div>
    <div id="hint" class="center-note">
      Hold left / right to shift your line · hold into a bend to drift<br />Weave through traffic · nitro smashes cars out of the way
    </div>
    <div id="results" aria-live="polite"></div>

    <div id="hud">
      <div class="readout">
        <div id="score">0</div>
        <div id="mult">2x FLOW</div>
        <div id="powers"></div>
      </div>
      <div id="timer">
        <div id="time">30</div>
        <div class="cp"><div id="cp-fill"></div></div>
        <div class="cp-label">CHECKPOINT</div>
      </div>
      <div id="speed">0<small>km/h</small></div>
      <button id="nitro" type="button" aria-label="Fire nitro">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="track" cx="30" cy="30" r="26" />
          <circle id="nitro-ring" cx="30" cy="30" r="26" />
        </svg>
        <span>N<sub>2</sub>O</span>
      </button>
      <div class="controls">
        <button id="btn-theme" type="button" aria-label="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
          </svg>
        </button>
        <button id="btn-audio" type="button" aria-label="Toggle audio">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          </svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </div>

    <div id="garage" role="dialog" aria-label="Garage">
      <div class="g-top">
        <span id="g-level">LV 1</span>
        <span id="g-coins">◈ 0</span>
        <button id="g-close" type="button" aria-label="Close garage">✕</button>
      </div>
      <div class="g-title">GARAGE</div>
      <div class="g-stage">
        <button id="g-prev" type="button" aria-label="Previous car">‹</button>
        <canvas id="garage-canvas"></canvas>
        <button id="g-next" type="button" aria-label="Next car">›</button>
      </div>
      <div id="g-count"></div>
      <div id="g-name"></div>
      <div id="g-tag"></div>
      <div id="g-stats"></div>
      <div id="g-paints" aria-label="Paint"></div>
      <div id="g-paint-name"></div>
      <button id="g-action" type="button">SELECT</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
