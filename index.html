<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111317" />
    <meta name="description" content="FLOWLINE — a minimalist, chill endless driving game." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLOWLINE" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>FLOWLINE</title>
    <style>
      :root {
        --bg: #111317;
        --fg: #f4f1ea;
        --accent: #e86a4a;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --bg: #ece8e0;
        --fg: #1c1f24;
        --accent: #e05a3a;
        color-scheme: light;
      }
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        transition: background-color 400ms var(--ease), color 400ms var(--ease);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ── HUD ── */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px)
          calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);
      }
      .readout {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 18px);
        left: calc(env(safe-area-inset-left) + 20px);
        opacity: 0;
        transition: opacity 400ms var(--ease);
      }
      #hud.playing .readout {
        opacity: 1;
      }
      #score {
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        opacity: 0.85;
        line-height: 1;
      }
      #streak {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 8px 3px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity 300ms var(--ease), transform 300ms var(--ease);
      }
      #streak.show {
        opacity: 1;
        transform: none;
      }
      .controls {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 12px);
        right: calc(env(safe-area-inset-right) + 12px);
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      .controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg);
        opacity: 0.65;
        cursor: pointer;
        display: grid;
        place-items: center;
        border-radius: 10px;
        transition: opacity 200ms var(--ease), color 400ms var(--ease);
        touch-action: manipulation;
      }
      .controls button:hover,
      .controls button:active,
      .controls button:focus-visible {
        opacity: 1;
        outline: none;
      }
      .controls svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #btn-theme[data-state='dark'] .i-sun,
      #btn-theme[data-state='light'] .i-moon,
      #btn-audio[data-state='on'] .i-off,
      #btn-audio[data-state='off'] .i-on {
        display: none;
      }

      /* ── Title ── */
      #title {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: none;
        text-align: center;
        transition: opacity 400ms var(--ease);
        padding-bottom: 22vh;
      }
      #title.hidden {
        opacity: 0;
      }
      #title h1 {
        margin: 0;
        font-size: clamp(26px, 8vw, 40px);
        font-weight: 300;
        letter-spacing: 0.62em;
        margin-right: -0.62em; /* optically re-centre tracked text */
        text-shadow: 0 1px 18px var(--bg);
      }
      #best {
        font-size: 11px;
        letter-spacing: 0.28em;
        font-variant-numeric: tabular-nums;
        opacity: 0.55;
      }
      #prompt {
        margin-top: 18px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        animation: pulse 2.4s var(--ease) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #prompt {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="FLOWLINE game"></canvas>

    <div id="title">
      <h1>FLOWLINE</h1>
      <div id="best" hidden></div>
      <div id="prompt">Tap anywhere to drive</div>
    </div>

    <div id="hud">
      <div class="readout">
        <div id="score">0</div>
        <div id="streak">2x FLOW</div>
      </div>
      <div class="controls">
        <button id="btn-theme" type="button" aria-label="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" />
          </svg>
        </button>
        <button id="btn-audio" type="button" aria-label="Toggle audio">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          </svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
